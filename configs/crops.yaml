# SAGE Crop Registry Configuration
# Single Source of Truth for Crop Checkpoints & Taxonomy
default_hf_repo: "IDK-Chaitanya/SAGE5Class-cp"
base_model: "Qwen/Qwen2.5-VL-3B-Instruct"

crops:
  corn:
    display_name: "Corn (Maize)"
    hf_repo: "IDK-Chaitanya/SAGE5Class-cp"
    checkpoint_subpath: "corn_5ep/checkpoints/checkpoint-step-1000"
    model_type: "peft_lora"
    adapter_name: "corn_lora"
    prompt_template: "Analyze this image of a corn plant. Identify any crop disease, symptoms, affected plant organ, and pathogen."
    known_classes:
      - "Bacterial_Rot_And_Blight"
      - "Common_Rust"
      - "Ear_Rots"
      - "Gray_Leaf_Spot"
      - "Leaf_Blight"
      - "Maize_Lethal_Necrosis"
      - "Maize_Streak_Virus"
      - "Northern_Leaf_Blight"
      - "Healthy"

